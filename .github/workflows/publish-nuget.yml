name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Pack & Publish to NuGet
    runs-on: ubuntu-latest

    steps:
      # Shallow checkout: no step here needs git history — generate_release_notes
      # is a server-side GitHub API feature, not derived from the local clone.
      # A full fetch-depth: 0 was pulling this repo's ~800MB of since-removed
      # docs/images/*.gif history for no reason.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # PromptPlus's own version comes from this tag (-p:Version below), but the
      # ConsolePlus.net PackageReference version is a literal in the csproj that
      # -p:Version does NOT touch — dotnet pack writes it into the .nuspec exactly
      # as written. A stable tag (no "-") packed with a prerelease pin would ship
      # permanently (published packages can't be edited) with a bad dependency.
      - name: Guard against a stable release pinning a prerelease ConsolePlus.net
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CONSOLEPLUS_VERSION=$(sed -n 's/.*<PackageReference Include="ConsolePlus.net" Version="\([^"]*\)".*/\1/p' src/PromptPlus.csproj)
          echo "Releasing PromptPlus $VERSION, pinned to ConsolePlus.net $CONSOLEPLUS_VERSION"
          if [[ "$VERSION" != *-* && "$CONSOLEPLUS_VERSION" == *-* ]]; then
            echo "::error::Releasing a stable PromptPlus version ($VERSION) but ConsolePlus.net is pinned to a prerelease ($CONSOLEPLUS_VERSION) in src/PromptPlus.csproj. Bump the pin to a stable ConsolePlus.net version before tagging a stable release."
            exit 1
          fi

      - name: Build (Release)
        run: dotnet build src/PromptPlus.csproj --configuration Release -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: dotnet test tests/PromptPlus.Tests/PromptPlus.Tests.csproj --configuration Debug --verbosity normal

      - name: Pack tool
        run: >
          dotnet pack src/PromptPlus.csproj
          --no-build
          --configuration Release
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output ./artifacts

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PromptPlus ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: ./artifacts/*.nupkg
